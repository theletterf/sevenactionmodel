{{ define "main" }}
  {{ partial "meta-block.html" . }}
  {{ if eq .Section "actions" }}
    {{ partial "action-page.html" . }}
  {{ else }}
    <h1 class="page-title">{{ .Title }}</h1>
    {{ .Content }}
    {{ if eq .Params.scope "rationale" }}
      {{ partial "cite-this.html" . }}
    {{ end }}
  {{ end }}
{{ end }}
