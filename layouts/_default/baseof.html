<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="layout">
    {{ partial "sidebar.html" . }}
    <div class="main-wrap">
      <header class="site-header">
        <a class="wordmark" href="{{ site.Home.RelPermalink }}">7act<span class="dot">.</span>org</a>
      </header>
      <main class="page">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
  </div>
  {{ partial "theme-toggle.html" . }}
</body>
</html>
