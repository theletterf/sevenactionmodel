<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} — {{ site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta name="author" content="{{ site.Params.author }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ with .OutputFormats.Get "md" }}<link rel="alternate" type="text/markdown" href="{{ .Permalink }}">{{ end }}
{{ with .OutputFormats.Get "llmstxt" }}<link rel="alternate" type="text/plain" href="{{ .Permalink }}">{{ end }}
{{ with .OutputFormats.Get "modeljson" }}<link rel="alternate" type="application/json" href="{{ .Permalink }}">{{ end }}
<link rel="sitemap" type="application/xml" href="{{ "sitemap.xml" | absURL }}">
{{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
<link rel="preload" href="{{ "fonts/dm-serif-display.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "fonts/eb-garamond-regular.woff" | relURL }}" as="font" type="font/woff" crossorigin>
<link rel="preload" href="{{ "fonts/fira-sans.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
