<script>
(function(){
  var html = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var stored = localStorage.getItem('theme');
  if (stored) { html.setAttribute('data-theme', stored); }
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) { html.setAttribute('data-theme', 'dark'); }
  btn.addEventListener('click', function(){
    var cur = html.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  var menuBtn = document.getElementById('menu-toggle');
  var menu = document.getElementById('sidebar-menu');
  if (menuBtn && menu) {
    menuBtn.addEventListener('click', function(){
      var isOpen = menu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }

  var langPicker = document.querySelector('.lang-picker');
  if (langPicker) {
    document.addEventListener('click', function(event){
      if (langPicker.open && !langPicker.contains(event.target)) {
        langPicker.removeAttribute('open');
      }
    });
    document.addEventListener('keydown', function(event){
      if (event.key === 'Escape' && langPicker.open) {
        langPicker.removeAttribute('open');
        langPicker.querySelector('summary').focus();
      }
    });
  }
})();
</script>
