{{ define "main" }}
  <h1 class="masthead">Documentation exists so that users can
    {{ range $i, $a := site.Data.model.actions }}
      {{ if eq $i 6 }}and {{ end }}<span class="hl">{{ $a.verb }}</span>{{ if lt $i 5 }}, {{ end }}
    {{ end }}.
  </h1>
  {{ .Content }}
  <div class="hero-heptagon">
    {{ partial "heptagon.html" (dict "size" 720 "labels" true "active" "") }}
  </div>
{{ end }}
