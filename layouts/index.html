{{ define "main" }}
  {{ $modelData := default site.Data.en.model (index site.Data site.Language.Lang "model") }}
  <h1 class="page-title">{{ $modelData.model.title }}</h1>
  <div class="home-tagline">
    {{ .Content }}
  </div>
  <div class="hero-heptagon" data-nosnippet>
    {{ partial "heptagon.html" (dict "size" 820 "labels" true "active" "") }}
    <p class="home-cta"><a href="{{ "rationale/" | relLangURL }}">{{ i18n "read_introduction" }} &rarr;</a></p>
  </div>
{{ end }}
