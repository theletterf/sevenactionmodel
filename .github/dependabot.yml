version: 2

updates:
  # The workflows pin every action to a commit SHA, which is what stops a
  # retagged or compromised upstream release from running here. A pin that
  # nobody moves goes stale instead, so let Dependabot propose the bumps and
  # rewrite both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
