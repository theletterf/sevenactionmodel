model: { version: "2025-01-09", license: "CC BY 4.0", title: "सात-क्रिया दस्तावेज़ीकरण मॉडल", description: "तकनीकी दस्तावेज़ उपयोगकर्ताओं की जरूरतों का सात क्रियाओं वाला वर्णनात्मक मॉडल।", canonical: "https://7act.org/", source: "https://7act.org/" }
actions:
  - { id: appraise, verb: "मूल्यांकन", alt: "पहचान", definition: "उत्पाद के मुख्य गुण समझें और जरूरत होने पर विकल्पों से तुलना करें।", description: "संभावित अपनाने वाले को उत्पाद की स्थिति और उसकी ताकत समझनी चाहिए।", signals: ["‘यह क्या है?’ सवाल बार-बार आते हैं।", "लोग केवल मार्केटिंग से सीखते हैं।", "स्थिति और लाभों का पृष्ठ नहीं है।"], metric: { name: "रूपांतरण", description: "दस्तावेज़ से उत्पाद अपनाने तक का परिवर्तन।" } }
  - { id: explore, verb: "अन्वेषण", alt: "खोज", definition: "कम बाधा के साथ उत्पाद आज़माएँ और जानें कि वह क्या कर सकता है।", description: "दस्तावेज़ों को शुरुआत में प्रयोग और संपर्क आसान बनाना चाहिए।", signals: ["त्वरित शुरुआत या सैंडबॉक्स नहीं है।", "पहला अनुभव भारी संदर्भ सामग्री है।", "आज़माने से पहले पूरी पुस्तिका पढ़नी पड़ती है।"], metric: { name: "पहले मूल्य तक समय", description: "पहली सफल सहभागिता तक का समय।" } }
  - { id: remember, verb: "स्मरण", alt: "पुनर्प्राप्ति", definition: "पैरामीटर से त्रुटि कोड तक, याद न रह सकने वाली जानकारी फिर पाएँ।", description: "संदर्भ सामग्री वर्षों तक दस्तावेज़ों को उपयोगी रखती है।", signals: ["पैरामीटर या त्रुटि नहीं मिलती।", "संदर्भ सामग्री बिखरी है।", "खोजने योग्य संरचित संदर्भ नहीं है।"], metric: { name: "संदर्भ सफलता दर", description: "सही उत्तर तक पहुँचने वाली खोजों का अनुपात।" } }
  - { id: troubleshoot, verb: "समस्या-निवारण", alt: "समाधान", definition: "समस्याओं का प्रभावी निदान और समाधान करें, अक्सर दबाव में।", description: "त्रुटियों और गलत विन्यासों से उबरने के लिए स्पष्ट मार्ग चाहिए।", signals: ["सहायता टिकट दोहराए जाते हैं।", "त्रुटि संदेश दर्ज नहीं हैं।", "त्रुटि की खोज समाधान तक नहीं पहुँचती।"], metric: { name: "समाधान समय", description: "लक्षण से कार्यशील स्थिति तक का औसत समय।" } }
  - { id: develop, verb: "विकास", alt: "एकीकरण", definition: "अतिरिक्त मूल्य बनाने के लिए उत्पाद पर निर्माण, विस्तार या एकीकरण करें।", description: "विकास दस्तावेज़ उत्पाद की क्षमता को व्यापक उपयोग में बदलते हैं।", signals: ["एकीकरण प्रश्न अनुत्तरित हैं।", "उत्पाद के ऊपर बनाने की गाइड नहीं है।", "विस्तार बिंदु दर्ज नहीं हैं।"], metric: { name: "पारिस्थितिकी वृद्धि", description: "उपयोगकर्ता-निर्मित एकीकरणों और विस्तारों की संख्या।" } }
  - { id: practice, verb: "अभ्यास", alt: "प्रशिक्षण", definition: "दैनिक मानक संचालन में उत्पाद चलाना सीखें।", description: "बार-बार होने वाले कामों के लिए उपयोगकर्ताओं को प्रक्रियात्मक ज्ञान चाहिए।", signals: ["कैसे करें वाले प्रश्न दोहराए जाते हैं।", "प्रक्रियाएँ केवल मौखिक ज्ञान हैं।", "सामान्य काम के लिए चरण-दर-चरण गाइड नहीं है।"], metric: { name: "कार्य सफलता", description: "बिना सहायता कार्य पूरा करने वालों का अनुपात।" } }
  - { id: understand, verb: "समझ", alt: "सीख", definition: "उत्पाद के अमूर्तन और मानसिक मॉडल समझें।", description: "वैचारिक दस्तावेज़ मुख्य विचारों के आसपास सीख को स्थिर करते हैं।", signals: ["उपयोगकर्ता कारण नहीं समझता।", "अवधारणाएँ केवल कोड टिप्पणियों में हैं।", "शब्दावली या अवधारणा गाइड नहीं है।"], metric: { name: "अवधारणा कवरेज", description: "समर्पित पृष्ठ वाले मुख्य अमूर्तनों का अनुपात।" } }
