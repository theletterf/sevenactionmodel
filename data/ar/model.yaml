model:
  version: "2025-01-09"
  license: "CC BY 4.0"
  title: "نموذج التوثيق ذي الإجراءات السبعة"
  description: "نموذج وصفي لاحتياجات مستخدمي الوثائق التقنية عبر سبعة إجراءات."
  canonical: "https://7act.org/"
  source: "https://7act.org/"
actions:
  - id: appraise
    verb: "قيّم"
    alt: "ميّز"
    definition: "ميّز خصائص المنتج الأساسية وقارنه بالبدائل عند الحاجة."
    description: "يحتاج العميل أو المتبني المحتمل إلى فهم موقع المنتج ونقاط قوته قبل المتابعة."
    signals: ["تتكرر أسئلة ما هذا المنتج؟", "يتعلم المهتمون من التسويق لا الوثائق.", "لا توجد صفحة للموقع والميزات الرئيسية."]
    metric: { name: "التحويل", description: "انتقال القارئ من الوثائق إلى تبني المنتج." }
  - id: explore
    verb: "استكشف"
    alt: "اكتشف"
    definition: "جرّب المنتج واكتشف ما يستطيع فعله بحاجز دخول منخفض."
    description: "ينبغي أن تتيح الوثائق للمستخدم التفاعل والتجربة في بداية رحلته."
    signals: ["لا توجد بداية سريعة أو بيئة تجريب.", "التجربة الأولى مرجع كثيف بلا إرشاد.", "يجب قراءة دليل كامل قبل التجربة."]
    metric: { name: "زمن الوصول إلى القيمة", description: "المدة حتى أول تفاعل ناجح." }
  - id: remember
    verb: "تذكّر"
    alt: "استرجع"
    definition: "استرجع معلومات لا يمكن حفظها، من المعاملات إلى رموز الأخطاء."
    description: "المرجع يحفظ قابلية استخدام الوثائق بعد سنوات من الخبرة."
    signals: ["لا يجد المستخدم معاملاً أو رمز خطأ.", "المراجع موزعة بين مدونات ومحادثات.", "لا يوجد مرجع منظم قابل للبحث."]
    metric: { name: "معدل إصابة المرجع", description: "نسبة عمليات البحث التي تصل إلى الإجابة الصحيحة." }
  - id: troubleshoot
    verb: "حلّ المشكلات"
    alt: "حلّ"
    definition: "شخّص المشكلات وحلها بكفاءة، غالباً تحت الضغط."
    description: "تظهر الأخطاء والحالات الحدّية في كل منتج، ويحتاج المستخدم إلى مسار للتعافي."
    signals: ["تتكرر تذاكر الدعم.", "رسائل الخطأ غير موثقة.", "البحث عن الخطأ لا يصل إلى حل."]
    metric: { name: "زمن الحل", description: "الزمن الوسيط من العرض إلى حالة عاملة." }
  - id: develop
    verb: "طوّر"
    alt: "ادمج"
    definition: "ابنِ فوق المنتج أو وسّعه أو ادمجه لإنشاء قيمة إضافية."
    description: "تتيح وثائق التكامل للمستخدمين تحويل قدرات المنتج إلى نظام أوسع."
    signals: ["أسئلة التكامل بلا إجابة.", "لا يوجد دليل للبناء فوق المنتج.", "نقاط التوسعة غير موثقة."]
    metric: { name: "نمو النظام البيئي", description: "عدد التكاملات أو الامتدادات التي ينشئها المستخدمون." }
  - id: practice
    verb: "مارس"
    alt: "تدرّب"
    definition: "تعلّم تشغيل المنتج في العمل اليومي المعتاد."
    description: "المستخدمون يحتاجون معرفة إجرائية للمهام القياسية المتكررة."
    signals: ["تتكرر أسئلة الكيفية.", "الإجراءات معرفة شفوية فقط.", "لا يوجد دليل خطوة بخطوة للمهام الشائعة."]
    metric: { name: "نجاح المهمة", description: "نسبة من ينجزون الإجراء بلا دعم." }
  - id: understand
    verb: "افهم"
    alt: "تعلّم"
    definition: "افهم التجريدات والنماذج الذهنية التي يقوم عليها المنتج."
    description: "تثبت الوثائق المفاهيمية التعلم حول الأفكار الأساسية للمنتج."
    signals: ["ينفذ المستخدم الخطوات بلا فهم للسبب.", "المفاهيم موجودة في التعليقات فقط.", "لا يوجد معجم أو دليل مفاهيم."]
    metric: { name: "تغطية المفاهيم", description: "نسبة التجريدات الأساسية ذات الصفحة المفاهيمية." }
