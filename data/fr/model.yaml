model: { version: "2025-01-09", license: "CC BY 4.0", title: "Modèle de documentation à sept actions", description: "Un modèle descriptif des besoins des utilisateurs de documentation technique en sept actions.", canonical: "https://7act.org/", source: "https://7act.org/" }
actions:
  - { id: appraise, verb: "Évaluer", alt: "Distinguer", definition: "Distinguer les qualités principales du produit et le comparer si nécessaire.", description: "Les prospects doivent comprendre le positionnement et les forces du produit avant de l’adopter.", signals: ["Les questions « qu’est-ce que c’est ? » se répètent.", "Les prospects n’apprennent qu’auprès du marketing.", "Aucune page ne présente positionnement et forces."], metric: { name: "conversion", description: "Passage de la documentation à l’adoption du produit." } }
  - { id: explore, verb: "Explorer", alt: "Découvrir", definition: "Essayer le produit et découvrir ses possibilités avec peu de friction.", description: "La documentation doit faciliter l’interaction et l’essai dès le début.", signals: ["Pas de démarrage rapide ni de bac à sable.", "La première expérience est une masse de référence.", "Il faut lire tout un manuel avant d’essayer."], metric: { name: "temps jusqu’à la première valeur", description: "Temps avant une première interaction réussie." } }
  - { id: remember, verb: "Se souvenir", alt: "Retrouver", definition: "Retrouver des informations non mémorisables, des paramètres aux erreurs.", description: "La référence maintient l’utilité de la documentation sur le long terme.", signals: ["Paramètre ou code d’erreur introuvable.", "La référence est dispersée.", "Aucune référence structurée et consultable."], metric: { name: "taux de succès de la référence", description: "Part des recherches qui atteignent la bonne réponse." } }
  - { id: troubleshoot, verb: "Dépanner", alt: "Résoudre", definition: "Diagnostiquer et résoudre efficacement des problèmes, souvent sous pression.", description: "Les erreurs et cas limites exigent un chemin fiable vers le rétablissement.", signals: ["Les tickets d’assistance se répètent.", "Les messages d’erreur ne sont pas documentés.", "Une recherche d’erreur ne mène pas au remède."], metric: { name: "temps de résolution", description: "Temps médian entre symptôme et état fonctionnel." } }
  - { id: develop, verb: "Développer", alt: "Intégrer", definition: "Développer sur le produit, l’étendre ou l’intégrer pour créer de la valeur.", description: "La documentation d’intégration transforme les capacités du produit en valeur nouvelle.", signals: ["Questions d’intégration sans réponse.", "Pas de guide pour construire sur le produit.", "Points d’extension non documentés."], metric: { name: "croissance de l’écosystème", description: "Nombre d’intégrations et extensions créées." } }
  - { id: practice, verb: "Pratiquer", alt: "S’entraîner", definition: "Apprendre à utiliser le produit dans l’exploitation quotidienne.", description: "Les utilisateurs ont besoin de connaissances procédurales pour les tâches récurrentes.", signals: ["Les questions pratiques se répètent.", "Les procédures ne sont que du savoir oral.", "Pas de guide pas à pas pour les tâches courantes."], metric: { name: "réussite de la tâche", description: "Part des utilisateurs qui terminent sans assistance." } }
  - { id: understand, verb: "Comprendre", alt: "Apprendre", definition: "Saisir les abstractions et modèles mentaux du produit.", description: "La documentation conceptuelle ancre l’apprentissage autour des idées fondamentales.", signals: ["L’utilisateur ne comprend pas le pourquoi.", "Les concepts ne figurent que dans les commentaires.", "Pas de glossaire ni de guide conceptuel."], metric: { name: "couverture des concepts", description: "Part des abstractions clés ayant une page dédiée." } }
