model: { version: "2025-01-09", license: "CC BY 4.0", title: "Sieben-Aktionen-Dokumentationsmodell", description: "Ein beschreibendes Modell technischer Dokumentationsbedürfnisse in sieben Aktionen.", canonical: "https://7act.org/", source: "https://7act.org/" }
actions:
  - { id: appraise, verb: "Bewerten", alt: "Erkennen", definition: "Die wichtigsten Produkteigenschaften erkennen und bei Bedarf vergleichen.", description: "Potenzielle Anwender müssen Positionierung und Stärken vor der Entscheidung verstehen.", signals: ["Fragen wie „Was ist das?“ wiederholen sich.", "Interessenten lernen nur aus Marketingmaterial.", "Es gibt keine Seite zu Positionierung und Stärken."], metric: { name: "Conversion", description: "Übergang von Dokumentation zur Produktannahme." } }
  - { id: explore, verb: "Erkunden", alt: "Entdecken", definition: "Das Produkt mit geringer Einstiegshürde ausprobieren und entdecken.", description: "Dokumentation soll Interaktion und Ausprobieren früh erleichtern.", signals: ["Kein Schnellstart oder Sandbox.", "Die erste Erfahrung ist eine Referenzwand.", "Vor dem Ausprobieren muss ein Handbuch gelesen werden."], metric: { name: "Zeit bis zum ersten Nutzen", description: "Zeit bis zur ersten erfolgreichen Interaktion." } }
  - { id: remember, verb: "Erinnern", alt: "Nachschlagen", definition: "Nicht memorierbare Informationen von Parametern bis Fehlercodes wiederfinden.", description: "Referenzmaterial erhält die langfristige Nutzbarkeit der Dokumentation.", signals: ["Parameter oder Fehlercode werden nicht gefunden.", "Referenz ist über viele Orte verstreut.", "Keine strukturierte, durchsuchbare Referenz."], metric: { name: "Referenztrefferquote", description: "Anteil der Suchen mit der richtigen Antwort." } }
  - { id: troubleshoot, verb: "Fehler beheben", alt: "Lösen", definition: "Probleme effizient diagnostizieren und lösen, oft unter Druck.", description: "Fehler und Sonderfälle brauchen einen zuverlässigen Wiederherstellungsweg.", signals: ["Support-Tickets wiederholen sich.", "Fehlermeldungen sind nicht dokumentiert.", "Fehlersuchen führen nicht zur Lösung."], metric: { name: "Lösungszeit", description: "Median vom Symptom bis zum funktionierenden Zustand." } }
  - { id: develop, verb: "Entwickeln", alt: "Integrieren", definition: "Auf dem Produkt aufbauen, es erweitern oder integrieren, um Mehrwert zu schaffen.", description: "Integrationsdokumentation verwandelt Produktfähigkeiten in neuen Wert.", signals: ["Integrationsfragen bleiben unbeantwortet.", "Kein Leitfaden zum Aufbau auf dem Produkt.", "Erweiterungspunkte sind undokumentiert."], metric: { name: "Ökosystemwachstum", description: "Anzahl erstellter Integrationen und Erweiterungen." } }
  - { id: practice, verb: "Üben", alt: "Trainieren", definition: "Das Produkt im täglichen Standardbetrieb verwenden lernen.", description: "Für wiederkehrende Aufgaben brauchen Nutzer prozedurales Wissen.", signals: ["Wie-mache-ich-das-Fragen wiederholen sich.", "Verfahren existieren nur als mündliches Wissen.", "Kein Schritt-für-Schritt-Leitfaden."], metric: { name: "Aufgabenerfolg", description: "Anteil erfolgreicher Aufgaben ohne Unterstützung." } }
  - { id: understand, verb: "Verstehen", alt: "Lernen", definition: "Die Abstraktionen und mentalen Modelle des Produkts erfassen.", description: "Konzeptionelle Dokumentation verankert Lernen um die Grundideen.", signals: ["Nutzer verstehen das Warum nicht.", "Konzepte stehen nur in Code-Kommentaren.", "Kein Glossar oder Konzeptleitfaden."], metric: { name: "Konzeptabdeckung", description: "Anteil der Kernabstraktionen mit eigener Seite." } }
