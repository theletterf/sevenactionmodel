model: { version: "2025-01-09", license: "CC BY 4.0", title: "مدل مستندسازی هفت‌کنشی", description: "مدلی توصیفی از نیازهای کاربران مستندات فنی در هفت کنش.", canonical: "https://7act.org/", source: "https://7act.org/" }
actions:
  - id: appraise
    verb: "ارزیابی"
    alt: "تمایز"
    definition: "ویژگی‌های اصلی محصول را تشخیص دهید و در صورت نیاز با گزینه‌های دیگر مقایسه کنید."
    description: "پذیرندگان بالقوه باید جایگاه و توانمندی‌های اصلی محصول را پیش از انتخاب بفهمند."
    signals: ["پرسش‌های «این چیست؟» تکرار می‌شوند.", "مخاطبان فقط از بازاریابی می‌آموزند.", "صفحه‌ای برای جایگاه و قوت‌ها نیست."]
    metric: { name: "تبدیل", description: "گذار از خواندن مستندات به پذیرش محصول." }
  - id: explore
    verb: "کاوش"
    alt: "کشف"
    definition: "محصول را با مانعی کم بیازمایید و توان آن را کشف کنید."
    description: "مستندات باید تعامل و آزمودن را در آغاز سفر کاربر آسان کند."
    signals: ["شروع سریع یا محیط آزمایشی نیست.", "تجربهٔ اول، مرجع سنگین است.", "پیش از آزمودن باید راهنما خواند."]
    metric: { name: "زمان تا ارزش نخست", description: "زمان رسیدن به نخستین تعامل موفق." }
  - id: remember
    verb: "یادآوری"
    alt: "بازیابی"
    definition: "اطلاعات فراموش‌شدنی، از پارامتر تا کد خطا، را بازیابی کنید."
    description: "مرجع، مستندات را پس از سال‌ها استفاده زنده نگه می‌دارد."
    signals: ["پارامتر یا خطا پیدا نمی‌شود.", "مرجع میان کانال‌ها پراکنده است.", "مرجع ساخت‌یافته و جست‌وجوپذیر نیست."]
    metric: { name: "نرخ یافتن مرجع", description: "سهم جست‌وجوهایی که به پاسخ درست می‌رسند." }
  - id: troubleshoot
    verb: "عیب‌یابی"
    alt: "حل"
    definition: "مسئله‌ها را، اغلب زیر فشار، کارآمد تشخیص دهید و حل کنید."
    description: "پیکربندی نادرست و خطاها به مسیر قابل اعتماد برای بازیابی نیاز دارند."
    signals: ["تیکت‌های پشتیبانی تکراری‌اند.", "پیام خطا مستند نیست.", "جست‌وجوی خطا به راه‌حل نمی‌رسد."]
    metric: { name: "زمان حل", description: "میانهٔ زمان از نشانه تا وضعیت کارا." }
  - id: develop
    verb: "توسعه"
    alt: "یکپارچه‌سازی"
    definition: "بر پایهٔ محصول بسازید، آن را گسترش دهید یا یکپارچه کنید."
    description: "مستندات توسعه، ظرفیت‌های محصول را به ارزش تازه تبدیل می‌کند."
    signals: ["پرسش‌های یکپارچه‌سازی بی‌پاسخ‌اند.", "راهنمای ساخت روی محصول نیست.", "نقطه‌های توسعه مستند نیستند."]
    metric: { name: "رشد بوم‌سازگان", description: "شمار یکپارچه‌سازی‌ها و افزونه‌ها." }
  - id: practice
    verb: "تمرین"
    alt: "آموزش"
    definition: "کار با محصول را در عملیات استاندارد روزانه بیاموزید."
    description: "کاربران برای کارهای تکراری به دانش رویه‌ای نیاز دارند."
    signals: ["پرسش‌های چگونه‌انجام‌دادن تکرار می‌شوند.", "رویه‌ها شفاهی‌اند.", "راهنمای گام‌به‌گام نیست."]
    metric: { name: "موفقیت کار", description: "سهم انجام کار بدون پشتیبانی." }
  - id: understand
    verb: "درک"
    alt: "یادگیری"
    definition: "انتزاع‌ها و مدل‌های ذهنیِ سازندهٔ محصول را بفهمید."
    description: "توضیح مفهومی، یادگیری را پیرامون ایده‌های اصلی محصول تثبیت می‌کند."
    signals: ["کاربر چرایی کار را نمی‌داند.", "مفهوم‌ها فقط در نظرهای کدند.", "معجم یا راهنمای مفهومی نیست."]
    metric: { name: "پوشش مفهوم", description: "سهم مفاهیم اصلی با صفحهٔ ویژه." }
