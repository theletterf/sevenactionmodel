# ============================================================================
# Seven-Action Documentation Model — Persian content
# Mirrors data/en/model.yaml. DITA tags and external example titles/URLs are
# kept unchanged because they refer to specific frameworks and resources.
# ============================================================================

model:
  version: "2025-01-09"
  license: "CC BY 4.0"
  title: "مدل مستندسازی هفت‌کنشی"
  description: >-
    مدلی توصیفی از نیازهای کاربران مستندات فنی. هفت کنش هدف‌هایی را پوشش
    می‌دهند که مصرف‌کنندهٔ مستندات ممکن است بخواهد به آن‌ها برسد: ارزیابی،
    درک، کاوش، تمرین، یادآوری، توسعه و عیب‌یابی.
  canonical: "https://passo.uno/seven-action-model/"
  source: "https://passo.uno/seven-action-model/index.md"

actions:
  - id: appraise
    verb: "ارزیابی"
    alt: "تمایز"
    definition: "ویژگی‌های اصلی محصول را تشخیص دهید و، در صورت لزوم، آن را با دیگر محصولات مقایسه کنید."
    description: >-
      کاربران مستندات، مشتریان یا پذیرندگان بالقوه نیز هستند. خواننده باید
      بتواند ویژگی‌های اصلی محصول را تشخیص دهد و آن را با دیگر محصولات
      مقایسه کند. این فرایندی برای کشف است.
    signals:
      - "تیم‌های پشتیبانی و فروش بارها به پرسش یکسان «این چیست؟» پاسخ می‌دهند."
      - "مشتریان بالقوه کارکرد محصول را از متن‌های بازاریابی می‌آموزند، نه از مستندات."
      - "صفحه‌ای وجود ندارد که جایگاه یا نقاط قوت اصلی محصول را بیان کند."
    examples:
      - title: "What is Databricks?"
        url: "https://docs.databricks.com/en/introduction/index.html"
      - title: "Splunk Observability Cloud Service Description"
        url: "https://docs.splunk.com/observability/en/get-started/service-description.html"
    frameworks:
      dita:
        - "<topic>"
        - "<concept>"
      diataxis:
        - "معادل مستقیمی ندارد (نزدیک‌ترین: توضیح)"
      good_docs:
        - "نمای کلی"
        - "صفحهٔ فرود"
    metric:
      name: "تبدیل"
      description: "نرخ تبدیل از مستندات به پذیرش محصول."

  - id: explore
    verb: "کاوش"
    alt: "کشف"
    definition: "محصول را با مانع ورود اندکی بیازمایید و کشف کنید چه کارهایی می‌تواند انجام دهد."
    description: >-
      محصولات عالی کاربران را به تعامل و آزمودن چیزهای تازه دعوت می‌کنند.
      مستندات باید سرنخ‌ها، دستورالعمل‌ها و امکان‌هایی فراهم کنند که کاوش را
      به‌عنوان یکی از نخستین فعالیت‌ها آسان سازند.
    signals:
      - "کاربران تازه نمی‌توانند شروع سریعی یا محیطی آزمایشی برای آزمودن محصول پیدا کنند."
      - "نخستین تجربه، دیواری از مطالب مرجع است، نه یک گشت هدایت‌شده."
      - "کاربران باید پیش از دست زدن به محصول، راهنمایی کامل را بخوانند."
    examples:
      - title: "React Quick Start"
        url: "https://react.dev/learn"
      - title: "Tour of Go"
        url: "https://go.dev/tour/welcome/1"
    frameworks:
      dita:
        - "<task>"
        - "<step>"
        - "<substep>"
      diataxis:
        - "آموزش"
      good_docs:
        - "آموزش"
    metric:
      name: "زمان تا نخستین ارزش"
      description: "زمان میان نخستین بازدید تا نخستین تعامل موفق."

  - id: remember
    verb: "یادآوری"
    alt: "بازیابی"
    definition: "بخش‌هایی از اطلاعات را که نتوانسته‌اید حفظ کنید، از پارامترها تا کدهای خطا، بازیابی کنید."
    description: >-
      مطالب مرجع، مستندات را پس از سال‌ها استفاده زنده نگه می‌دارند. کاربران
      راهنماها را مرور می‌کنند تا بخش‌هایی از اطلاعات را که نتوانسته‌اند به
      خاطر بسپارند، یادآوری، بازیابی یا جست‌وجو کنند.
    signals:
      - "کاربران پارامتر یا کد خطایی را جست‌وجو می‌کنند و چیزی نمی‌یابند."
      - "مطالب مرجع در نوشته‌های وبلاگ و گزارش‌های گفت‌وگو پراکنده‌اند."
      - "هیچ مرجع ساخت‌یافته و جست‌وجوپذیری برای نحو یا تنظیمات محصول وجود ندارد."
    examples:
      - title: "Dockerfile reference"
        url: "https://docs.docker.com/reference/dockerfile/"
      - title: "GitLab CI/CD YAML syntax reference"
        url: "https://docs.gitlab.com/ee/ci/yaml/"
    frameworks:
      dita:
        - "<reference>"
        - "<refsyn>"
        - "<properties>"
      diataxis:
        - "مرجع"
      good_docs:
        - "مرجع"
        - "واژه‌نامه"
    metric:
      name: "نرخ یافتن مرجع"
      description: "سهم جست‌وجوهای مرجع که صفحهٔ درست را بازمی‌گردانند."

  - id: troubleshoot
    verb: "عیب‌یابی"
    alt: "حل"
    definition: "مسئله‌ها را، اغلب زیر فشار، به‌شکلی کارآمد تشخیص دهید و حل کنید."
    description: >-
      برخورد با مشکل‌ها — پیکربندی‌های نادرست، حالت‌های مرزی یا باگ‌های واقعی —
      تجربه‌ای رایج برای کاربر است. عیب‌یابی نمایانگر نیاز به تشخیص و حل
      کارآمد مسئله‌هاست؛ اغلب زیر فشار، هنگامی که سامانه‌ها از کار افتاده‌اند
      یا موعدها نزدیک می‌شوند.
    signals:
      - "تیکت‌های پشتیبانی همان پرسش را تکرار می‌کنند و پاسخ در گزارش گفت‌وگوست، نه در مستندات."
      - "پیام‌های خطا در کد ظاهر می‌شوند، اما هرگز در مستندات نمی‌آیند."
      - "کاربران عبارت خطایی را جست‌وجو می‌کنند و به صفحه‌ای می‌رسند که آن را ذکر نکرده است."
    examples:
      - title: "Kubernetes Debug Pods"
        url: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"
      - title: "Elasticsearch Troubleshooting"
        url: "https://www.elastic.co/guide/en/elasticsearch/reference/current/fix-common-cluster-issues.html"
    frameworks:
      dita:
        - "<troubleshooting>"
        - "<trouble>"
        - "<cause>"
        - "<remedy>"
      diataxis:
        - "راهنمای چگونگی انجام کار (مسئله‌محور)"
      good_docs:
        - "راهنمای عیب‌یابی"
    metric:
      name: "زمان حل"
      description: "میانهٔ زمان از پدیدار شدن نشانه تا رسیدن به وضعیت کارا."

  - id: develop
    verb: "توسعه"
    alt: "یکپارچه‌سازی"
    definition: "بر پایهٔ محصول بسازید، آن را گسترش دهید یا یکپارچه کنید تا ارزش بیشتری بیافرینید."
    description: >-
      کاربران اغلب باید بر محصولات موجود بنا کنند، آن‌ها را گسترش دهند یا با
      آن‌ها یکپارچه شوند — از راه یکپارچه‌سازی‌ها، افزونه‌ها، پلاگین‌ها یا
      برنامه‌های کاملاً تازه. تمرکز تقریباً همیشه عمل‌گرایانه است.
    signals:
      - "پرسش‌های یکپارچه‌سازی و گسترش بی‌پاسخ می‌مانند یا به انجمنی ارجاع داده می‌شوند."
      - "راهنمایی برای ساختن بر پایهٔ محصول وجود ندارد."
      - "نقاط گسترش محصول مستند نشده‌اند."
    examples:
      - title: "Vercel Approval Checklist"
        url: "https://vercel.com/docs/integrations/create-integration/approval-checklist"
      - title: "Chrome Debug extensions"
        url: "https://developer.chrome.com/docs/extensions/get-started/tutorial/debug"
    frameworks:
      dita:
        - "<task>"
        - "<codeblock>"
        - "<coderef>"
      diataxis:
        - "راهنمای چگونگی انجام کار"
      good_docs:
        - "راهنمای چگونگی انجام کار"
        - "مرجع API"
    metric:
      name: "رشد بوم‌سازگان"
      description: "تعداد یکپارچه‌سازی‌ها یا افزونه‌هایی که کاربران می‌سازند."

  - id: practice
    verb: "تمرین"
    alt: "آموزش"
    definition: "شیوهٔ کار با محصول را در عملیات روزانه و استاندارد بیاموزید."
    description: >-
      کاربران باید شیوهٔ کار با بیشتر بخش‌های یک محصول را بیاموزند. تمرین،
      نیاز به دانش رویه‌ای را توصیف می‌کند — یعنی چگونگی استفاده از محصول در
      عملیات روزانه و استاندارد.
    signals:
      - "همان پرسش‌های چگونگی انجام کار در کانال‌های پشتیبانی و اجتماع تکرار می‌شوند."
      - "رویه‌ها فقط به‌شکل دانش شفاهی یا در ذهن یک نفر وجود دارند."
      - "راهنمای گام‌به‌گامی برای کارهای مدیریتی رایج وجود ندارد."
    examples:
      - title: "Generating a new SSH key (GitHub)"
        url: "https://docs.github.com/en/authentication/connecting-to-github-with-ssh/generating-a-new-ssh-key-and-adding-it-to-the-ssh-agent"
      - title: "Import contacts to MailChimp"
        url: "https://mailchimp.com/help/import-contacts-mailchimp/"
    frameworks:
      dita:
        - "<task>"
        - "<step>"
        - "<choicetable>"
      diataxis:
        - "راهنمای چگونگی انجام کار"
      good_docs:
        - "راهنمای چگونگی انجام کار"
    metric:
      name: "موفقیت کار"
      description: "سهم کاربرانی که رویه‌ای استاندارد را بدون پشتیبانی به پایان می‌رسانند."

  - id: understand
    verb: "درک"
    alt: "یادگیری"
    definition: "انتزاع‌ها و مدل‌های ذهنی‌ای را که محصول بر پایهٔ آن‌ها ساخته شده است، درک کنید."
    description: >-
      محصولات نرم‌افزاری پیرامون انتزاع‌هایی ساخته می‌شوند که فهمشان دشوار،
      اما برای استفادهٔ درست بنیادی است. مستندات مفهومی، یادگیری را در کنار
      کاوش و تمرین استوار می‌کنند.
    signals:
      - "کاربران می‌توانند با محصول کار کنند، اما نمی‌توانند توضیح دهند چرا به این شکل کار می‌کند."
      - "مفهوم‌ها فقط در توضیحات کد یا ویکی‌های داخلی شرح داده شده‌اند."
      - "واژه‌نامه یا راهنمای مفهومی‌ای برای انتزاع‌های اصلی محصول وجود ندارد."
    examples:
      - title: "Kubernetes Concepts"
        url: "https://kubernetes.io/docs/concepts/overview/components/"
      - title: "Thinking in React"
        url: "https://react.dev/learn/thinking-in-react"
    frameworks:
      dita:
        - "<concept>"
        - "<glossentry>"
        - "<section>"
      diataxis:
        - "توضیح"
      good_docs:
        - "راهنمای مفهومی"
        - "واژه‌نامه"
    metric:
      name: "پوشش مفهوم"
      description: "سهم انتزاع‌های اصلی که صفحهٔ مفهومی ویژه‌ای دارند."
